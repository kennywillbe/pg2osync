[package]
name = "pg2osync-operator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
kube = { version = "4.2", default-features = false, features = ["client", "derive", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
schemars = "1.2"
# Both `ring` and `aws-lc-rs` reach this binary through kube's dependencies, so
# rustls refuses to guess a process-wide default and the operator picks the
# same backend crates/tls picks.
rustls = { version = "0.23.43", features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = "1.2"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
clap = { workspace = true, features = ["env"] }
sha2 = { workspace = true }

[dev-dependencies]
# the rendered files are asserted to be TOML the pipeline's parser takes, not
# merely bytes that look right
toml = { workspace = true }
