[package]
name = "pg2osync-source-mysql"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MySQL/MariaDB binlog source for pg2osync"

[dependencies]
pg2osync-core = { path = "../core" }
pg2osync-tls = { path = "../tls" }
tokio.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha1.workspace = true
sha2.workspace = true
futures-util = "0.3.34"
base64 = "0.23.1"
crc32fast = "1.5.1"
url = "2.5.8"
tokio-rustls = "0.26.4"
rustls = { version = "0.23.43", features = ["ring"] }
rsa = "0.9.10"
# rsa 0.9 is built on digest 0.10 and rand_core 0.6, while the workspace has
# moved on to sha1/sha2 0.11. These pinned aliases exist only to feed OAEP;
# rsa 0.10, which would resolve the split, is still a release candidate.
sha1-oaep = { package = "sha1", version = "0.10" }
rand-oaep = { package = "rand", version = "0.8" }

[dev-dependencies]
# The examples are small binaries, not library code: they may report with
# anyhow the way `crates/bin` does.
anyhow.workspace = true
