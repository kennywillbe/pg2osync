[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/source",
    "crates/source-mysql",
    "crates/sink",
    "crates/engine",
    "crates/bin",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/emresimsek/pg2osync"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
pgwire-replication = "0.4"
opensearch = { version = "2.4", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
tracing = "0.1"

