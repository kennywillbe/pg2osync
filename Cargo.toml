[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tls",
    "crates/source",
    "crates/source-mysql",
    "crates/sink",
    "crates/engine",
    "crates/bin",
    "crates/operator",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/kennywillbe/pg2osync"
homepage = "https://github.com/kennywillbe/pg2osync"
authors = ["pg2osync contributors"]
keywords = ["cdc", "postgresql", "mysql", "opensearch", "elasticsearch"]
categories = ["database", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
pgwire-replication = "0.4"
opensearch = { version = "2.4", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
sha1 = "0.11"
sha2 = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
tracing = "0.1"
# `clock` is left off on purpose: nothing here may read a local time zone, or
# the same value would normalize differently on two hosts. Feature unification
# turns it on anyway through serde_with, so the flag states intent, not weight.
chrono = { version = "0.4", default-features = false, features = ["std"] }

