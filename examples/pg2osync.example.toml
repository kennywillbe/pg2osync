# pg2osync example configuration. Copy to pg2osync.toml and adjust.
# Every option is documented in docs/configuration.md.

[source]
# "postgres" (default) or "mysql" (also covers MariaDB)
flavor = "postgres"
# Credentials come from the environment; an inline `url` works but warns.
url_env = "PG2OSYNC_SOURCE_URL"     # postgres://user:pass@host:5432/db
# TLS, in libpq's vocabulary: disable | prefer | require | verify-ca | verify-full
# Defaults to the URL's own sslmode, then to "prefer". Managed providers
# generally need "require" at minimum; "verify-full" is the safe choice.
# sslmode = "verify-full"
# sslrootcert = "/etc/ssl/certs/rds-ca.pem"
slot_name = "pg2osync"
publication = "pg2osync_pub"
# A broken stream is retried in process with backoff; after this many
# consecutive failures the process exits and the supervisor takes over.
# reconnect_max = 10
# reconnect_backoff_ms = 1000
# admin_url_env = "PG2OSYNC_ADMIN_URL"   # separate user for catalog queries
# Ranges of the initial load read at once, each on its own connection. Worth
# raising only for tables with nested children, where the server aggregates per
# parent row: +53% there, +5-8% on ordinary tables for four times the read load.
# load_workers = 1

# MySQL only:
# server_id = 424242                     # unique across the server's replicas

# Polling fallback for managed PostgreSQL without logical replication.
# Deletes cannot be detected in this mode.
# mode = "poll"
# poll_column = "updated_at"
# poll_interval_secs = 30

[target]
# "opensearch" (default), "elasticsearch" or "meilisearch"
flavor = "opensearch"
url = "http://localhost:9200"
username = "admin"
password_env = "PG2OSYNC_TARGET_PASSWORD"
tls_verify = true
# api_key_env = "ES_API_KEY"             # Elasticsearch API key / Meilisearch key
# state_dir = "./.pg2osync-state"        # Meilisearch checkpoint directory

[engine]
batch_size = 500
batch_max_bytes = 10485760
# Write requests open against the target at once. One is what the initial load
# is limited by; four roughly doubles it, at four times the load on the target.
write_concurrency = 1
txn_buffer_cap_mb = 256
retry_max = 10
retry_backoff_ms = 500
checkpoint_interval_ms = 500

# Read-your-writes: GET /synced blocks until your own commit is searchable.
# Off by default because it is a surface applications call.
# [api]
# enabled = true
# bind = "127.0.0.1:9101"
# token_env = "PG2OSYNC_API_TOKEN"

[metrics]
enabled = true
# use 0.0.0.0:9100 inside a container so probes can reach it
bind = "127.0.0.1:9100"
# Requires a bearer token on /metrics. Worth setting once the port is not
# loopback: the exposition names every table and how far behind the pipeline
# is. /healthz stays open, because probes cannot carry a token.
# token_env = "PG2OSYNC_METRICS_TOKEN"

[sync.users]
table = "public.users"               # database.table for MySQL
index = "users"
# primary_key = "id"                 # default: detected from the primary key
# Derived document id; unset keeps the primary key. Columns outside the key
# need REPLICA IDENTITY FULL on PostgreSQL, and the table refuses to start
# without it. A NULL in a named column halts the pipeline.
# id = "tenant-{tenant_id}-{id}"
# columns = ["id", "name", "email"]  # or exclude_columns, not both
exclude_columns = ["password_hash"]
# Mapping to create the index with, resolved relative to this file. Applied
# only when the index does not exist; an existing one is compared against it.
# mapping_file = "users-mapping.json"
# Poll mode only: a row matching this becomes a delete instead of an upsert.
# soft_delete = "deleted_at IS NOT NULL"

[sync.users.transform]
email = "redact"                     # "redact" -> "***", "hash" -> SHA-256 prefix

# Nested children: embed a one-to-many relation as a JSON array (one level).
# Child tables should have REPLICA IDENTITY FULL so deletes can find the parent.
# [sync.customers]
# table = "public.customers"
# index = "customers"
# primary_key = "id"
#
# [[sync.customers.children]]
# table = "public.orders"
# field = "orders"
# foreign_key = "customer_id"

# Fan-out: one document per element of an array column (PostgreSQL array or
# jsonb holding one; needs REPLICA IDENTITY FULL). The element id renders from
# the parent-minus-array document merged with the element.
# [sync.tickets]
# table = "public.tickets"
# id = "ticket-{id}"
# [sync.tickets.fan_out]
# field = "tags"
# id = "ticket-{id}-{tags}"
