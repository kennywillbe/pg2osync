# The five-minute quickstart: PostgreSQL, OpenSearch and pg2osync, seeded,
# with nothing of your own required and no Rust toolchain.
#
#   docker compose -f examples/docker-compose.yml up -d --wait
#   curl -s 'localhost:19200/products/_search?q=espresso' | jq '.hits.hits[]._source'
#   docker compose -f examples/docker-compose.yml down -v
#
# The published ports are deliberately not the usual 5432/9200: this stack is
# meant to come up beside whatever you already run, including this repository's
# own dev/docker-compose.yml.

services:
  postgres:
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    volumes:
      # The image runs everything here once, before it accepts connections.
      - ./quickstart/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  pg2osync:
    image: ghcr.io/kennywillbe/pg2osync:1.5.0 # x-release-please-version
    environment:
      RUST_LOG: pg2osync=info
      PG2OSYNC_SOURCE_URL: postgres://postgres:postgres@postgres:5432/shop
    volumes:
      - ./quickstart/pg2osync.toml:/etc/pg2osync/pg2osync.toml:ro
    ports:
      - "19100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 12
