# Config for the Next.js demo: syncs public.demo_products -> the
# demo_products OpenSearch index. Points at the local dev stack from
# dev/docker-compose.yml.
#
# The sync.* extras exist so the app can demonstrate features a plain
# table-to-index copy cannot show:
# - internal_note is excluded (never reaches OpenSearch)
# - supplier_email is redacted (indexed as ***)
# - demo_reviews is embedded on each product document as `reviews`

[source]
flavor = "postgres"
url_env = "PG2OSYNC_SOURCE_URL"    # postgres://postgres:postgres@localhost:15432/sourcedb
slot_name = "pg2osync_demo"
publication = "pg2osync_demo_pub"

[target]
flavor = "opensearch"
url = "http://localhost:9200"

[engine]
checkpoint_interval_ms = 200

[sync.demo_products]
table = "public.demo_products"
index = "demo_products"
primary_key = "id"
exclude_columns = ["internal_note"]

[sync.demo_products.transform]
supplier_email = "redact"

[[sync.demo_products.children]]
table = "public.demo_reviews"
field = "reviews"
foreign_key = "product_id"

[api]
enabled = true
bind = "127.0.0.1:9131"
