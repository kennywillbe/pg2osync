image:
  repository: ghcr.io/kennywillbe/pg2osync
  # defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The pipeline configuration, rendered into a ConfigMap as pg2osync.toml.
# Credentials belong in `secrets` or `existingSecret`, never here.
config:
  source:
    url_env: PG2OSYNC_SOURCE_URL
    slot_name: pg2osync
    publication: pg2osync_pub
  target:
    url: http://opensearch:9200
    # username: pg2osync
    # password_env: PG2OSYNC_TARGET_PASSWORD
  metrics:
    # not 127.0.0.1: kubelet probes and Prometheus reach the pod from outside,
    # which is also why /metrics is worth a token here
    bind: 0.0.0.0:9100
    # token_env: PG2OSYNC_METRICS_TOKEN
  # One entry per table. Left empty on purpose: Helm merges maps, so a default
  # table here would survive your override and sync something you never asked
  # for.
  sync: {}
  #  users:
  #    table: public.users        # database.table for MySQL
  #    index: users
  #    exclude_columns: ["password_hash"]
  #    transform:
  #      email: redact

# Raw TOML appended to the rendered config. Use it for constructs the values
# tree cannot express, such as repeated [[sync.x.children]] blocks.
extraConfig: ""

# Rendered into a Secret and exposed as environment variables. Prefer
# existingSecret in production so credentials never enter values.yaml.
secrets: {}
#  PG2OSYNC_SOURCE_URL: postgres://user:pass@postgres:5432/appdb
#  PG2OSYNC_TARGET_PASSWORD: changeme

# Name of a Secret that already holds the same keys (External Secrets, Vault,
# SOPS). Takes precedence over `secrets`.
existingSecret: ""

env:
  RUST_LOG: pg2osync=info
extraEnv: []

# Entrypoint and arguments. Empty means the image's own
# `pg2osync run -c /etc/pg2osync/pg2osync.toml`. Override both when the
# credentials arrive as a file a shell has to source first, as with the Vault
# Agent Injector; see docs/deployment.md.
command: []
args: []

# "text" or "json". Set it to json where a collector (Loki, Datadog,
# CloudWatch) parses the log stream instead of a human reading it.
logFormat: text

# What a change to the rendered config does to a running pod.
#
#   restart  the pod carries a checksum of the config, so `helm upgrade`
#            replaces it. Simple, and every option takes effect — at the cost
#            of a drain, a reconnect and a replay from the checkpoint.
#   signal   no checksum, so the pod stays. The kubelet updates the ConfigMap
#            volume in place (within about a minute) and a small sidecar sends
#            SIGHUP when the file changes. pg2osync then applies the settings a
#            batch reads and refuses the rest in place, naming the field — see
#            docs/configuration.md#reloading for which is which. Needs
#            shareProcessNamespace, and cannot work with a subPath mount of the
#            config, which the kubelet never updates in place.
reloadOnChange: restart

reloadSidecar:
  image: busybox:1.37
  intervalSeconds: 10
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      memory: 32Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  # headless: nothing needs to load-balance a single instance
  type: ClusterIP
  clusterIP: None
  port: 9100
  annotations: {}

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
    # Set together with config.metrics.token_env to require a token on
    # /metrics. The named secret key must hold the same value the pod reads
    # from that environment variable.
    # bearerTokenSecret:
    #   name: pg2osync-credentials
    #   key: PG2OSYNC_METRICS_TOKEN

# deploy/grafana/pg2osync.json as a ConfigMap for the Grafana sidecar to pick
# up. Off by default: a cluster without the sidecar just gets a ConfigMap
# nothing reads.
grafanaDashboard:
  enabled: false
  # The sidecar watches every namespace by default; set this when Grafana is
  # configured to watch its own.
  namespace: ""
  label: grafana_dashboard
  labelValue: "1"
  labels: {}
  # Rendered as the grafana_folder annotation when set.
  folder: ""

# The initial load of a large table happens before the endpoint answers, so the
# startup probe must outlast it; liveness alone would restart the pod forever.
probes:
  startup:
    enabled: true
    periodSeconds: 10
    failureThreshold: 60
  liveness:
    enabled: true
    periodSeconds: 30
    failureThreshold: 3
  # What "ready" means here: /healthz answers 200 as soon as the metrics
  # listener binds, which happens before the initial load runs, so readiness
  # reports "the process is up and its port answers", not "the checkpoint is
  # loaded". It is still worth having on the headless metrics Service: the pod
  # is out of the endpoint list while it is starting, failing or shutting down,
  # so nothing resolving the Service — a Prometheus scrape, a port-forward —
  # lands on a socket nobody is listening on, and a rollout does not count the
  # new pod as up until it answers.
  readiness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Meilisearch keeps its checkpoint on disk; give it a volume that survives
# restarts. Other targets store the checkpoint in the search cluster.
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  mountPath: /var/lib/pg2osync

# Volumes the pod mounts on top of the config (and the state volume when
# persistence is on). A Secrets Store CSI volume goes here: the driver only
# syncs a SecretProviderClass's secretObjects into a Kubernetes Secret while a
# pod actually mounts the volume.
extraVolumes: []
extraVolumeMounts: []

# With one replica, maxUnavailable: 0 refuses every voluntary eviction: a node
# drain hangs until someone deletes the pod or disables this. That is the point
# for a pipeline you would rather move deliberately than have a cluster upgrade
# move for you — and it is also the cost, so it is off by default rather than a
# surprise the first drain teaches you. Set minAvailable or maxUnavailable, not
# both.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 0
  # minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
terminationGracePeriodSeconds: 30
