{{- if not (has .Values.reloadOnChange (list "restart" "signal")) }}
{{- fail (printf "reloadOnChange must be \"restart\" or \"signal\", not %q" (toString .Values.reloadOnChange)) }}
{{- end }}
{{- if eq .Values.reloadOnChange "signal" }}
{{- range .Values.extraVolumeMounts }}
{{- if and .subPath (hasPrefix "/etc/pg2osync" .mountPath) }}
{{- fail (printf "reloadOnChange=signal cannot work with the subPath mount at %s: the kubelet never updates a subPath mount in place, so the file the sidecar watches would never change. Mount the whole volume, or use reloadOnChange=restart" .mountPath) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pg2osync.fullname" . }}
  labels:
    {{- include "pg2osync.labels" . | nindent 4 }}
spec:
  # Exactly one instance per replication slot: two processes on the same slot
  # fight over its position and undo each other's progress. Scale by splitting
  # tables across releases, each with its own slot_name.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pg2osync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if eq .Values.reloadOnChange "restart" }}
        # restarts the pod when the rendered config changes
        checksum/config: {{ include "pg2osync.config" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pg2osync.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pg2osync.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if eq .Values.reloadOnChange "signal" }}
      # the sidecar has to be able to see — and signal — the pipeline process
      shareProcessNamespace: true
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: pg2osync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- toYaml (.Values.args | default (list "run" "-c" "/etc/pg2osync/pg2osync.toml")) | nindent 12 }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: PG2OSYNC_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            # identifies the writer in the checkpoint document
            - name: PG2OSYNC_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.secrets .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ include "pg2osync.secretName" . }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 9100
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pg2osync
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: state
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if eq .Values.reloadOnChange "signal" }}
        # The ConfigMap volume is updated in place by the kubelet, on its own
        # sync period — up to about a minute after `helm upgrade` returns. This
        # watches the file the pipeline actually reads and sends it SIGHUP when
        # it changes; the pipeline validates the file itself and refuses in
        # place anything a running process cannot take, so a mistake here costs
        # a log line rather than the pod.
        - name: reload
          image: {{ .Values.reloadSidecar.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              seen=""
              while :; do
                now="$(stat -c %Y /etc/pg2osync/pg2osync.toml 2>/dev/null || echo missing)"
                if [ -n "$seen" ] && [ "$now" != "$seen" ]; then
                  echo "pg2osync.toml changed; sending SIGHUP"
                  pkill -HUP -x pg2osync || echo "no pg2osync process to signal"
                fi
                seen="$now"
                sleep {{ .Values.reloadSidecar.intervalSeconds }}
              done
          resources:
            {{- toYaml .Values.reloadSidecar.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pg2osync
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pg2osync.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "pg2osync.fullname" . }}-state
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
