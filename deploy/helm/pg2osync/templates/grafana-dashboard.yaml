{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pg2osync.fullname" . }}-grafana-dashboard
  {{- with .Values.grafanaDashboard.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "pg2osync.labels" . | nindent 4 }}
    # the Grafana sidecar picks a ConfigMap up by this label alone, which is why
    # the chart can ship a dashboard without talking to Grafana at all
    {{ .Values.grafanaDashboard.label }}: {{ .Values.grafanaDashboard.labelValue | quote }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.folder }}
  annotations:
    grafana_folder: {{ . | quote }}
  {{- end }}
data:
  pg2osync.json: |-
    {{- .Files.Get "dashboards/pg2osync.json" | nindent 4 }}
{{- end }}
