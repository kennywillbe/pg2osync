apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg2osync
  namespace: pg2osync
  labels:
    app.kubernetes.io/name: pg2osync
spec:
  # This Deployment owns these slots. Two processes streaming one slot fight
  # over its position and undo each other's progress, so a second replica is
  # not more throughput. To carry more source databases, add a file to the
  # ConfigMap and run --config-dir (see below); to spread them over nodes, use
  # a second Deployment with the other files.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pg2osync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg2osync
      annotations:
        # rolls the pod whenever the config changes
        checksum/config: "replace-with-configmap-hash"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pg2osync
          image: ghcr.io/kennywillbe/pg2osync:1.5.1 # x-release-please-version
          # one file, one source. With several *.toml in the ConfigMap:
          #   args: ["run", "--config-dir", "/etc/pg2osync"]
          args: ["run", "-c", "/etc/pg2osync/pg2osync.toml"]
          env:
            - name: RUST_LOG
              value: pg2osync=info
            # distinguishes instances in the checkpoint document
            - name: PG2OSYNC_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: pg2osync-credentials
          ports:
            - name: metrics
              containerPort: 9100
          startupProbe:
            # the initial load of a large table can take minutes; a liveness
            # probe alone would kill the pod before it ever streams
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            # /healthz answers 200 from the moment the metrics listener binds,
            # which is before the initial load runs, so this reports "the port
            # answers", not "the load is done" — enough to keep the Service
            # from resolving to a pod that is starting, failing or shutting
            # down
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/pg2osync
              readOnly: true
      # SIGTERM stops the stream between messages; the checkpoint is already
      # durable, so a short grace period is enough. It is the whole pod's:
      # every source in it drains within this budget, not each.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: pg2osync-config
