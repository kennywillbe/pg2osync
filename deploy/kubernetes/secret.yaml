# Credentials are read from the environment, never from the ConfigMap, so the
# config can be reviewed and diffed without exposing secrets.
#
# Replace these values, or better, drop this file and let an external secrets
# operator (External Secrets, Vault Agent, SOPS) create the same Secret name.
apiVersion: v1
kind: Secret
metadata:
  name: pg2osync-credentials
  namespace: pg2osync
type: Opaque
stringData:
  # One key per source: a second config file in the ConfigMap reads its own
  # url_env, and every source in the pod is served by this one Secret.
  PG2OSYNC_SOURCE_URL: postgres://replicator:CHANGE_ME@postgres.database.svc:5432/appdb
  PG2OSYNC_TARGET_PASSWORD: CHANGE_ME
