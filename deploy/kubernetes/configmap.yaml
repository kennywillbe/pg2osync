apiVersion: v1
kind: ConfigMap
metadata:
  name: pg2osync-config
  namespace: pg2osync
data:
  # One key per source database: a second file here, plus `run --config-dir
  # /etc/pg2osync` in the Deployment, runs both in the one process. Every file
  # then needs a slot_name of its own — the checkpoint is bound to the stream,
  # not to the file — while [metrics] and [api] describe the process, so they
  # belong in one file or the same in all of them.
  pg2osync.toml: |
    [source]
    url_env = "PG2OSYNC_SOURCE_URL"
    slot_name = "pg2osync"
    publication = "pg2osync_pub"

    [target]
    url = "http://opensearch.search.svc:9200"
    username = "pg2osync"
    password_env = "PG2OSYNC_TARGET_PASSWORD"

    [metrics]
    # 0.0.0.0 so kubelet probes and Prometheus can reach it from outside the pod
    bind = "0.0.0.0:9100"

    [sync.users]
    table = "public.users"
    index = "users"
    exclude_columns = ["password_hash"]
