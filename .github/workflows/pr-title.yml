name: PR title

# The squash commit takes its subject from the pull request title, and
# release-please reads that subject to decide the next version and to write the
# changelog line. A title that does not parse is a change that silently never
# appears in a release, so it is checked here rather than noticed later.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # In the merge queue there is no title to read, only the squash commits the
  # queue is about to land; their subjects are those titles, so check them.
  merge_group:

permissions:
  contents: read

jobs:
  conventional:
    name: the title is a conventional commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|perf|test|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [ -n "$GROUP_HEAD" ]; then
            bad=0
            while IFS= read -r subject; do
              if printf '%s' "$subject" | grep -Eq "$pattern"; then echo "ok: $subject"; else echo "::error::not a Conventional Commit: $subject"; bad=1; fi
            done < <(git log --format=%s "$GROUP_BASE..$GROUP_HEAD" | grep -v '^Merge ')
            exit $bad
          fi
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
            exit 0
          fi
          cat <<'EOF'
          ::error::The pull request title has to be a Conventional Commit, because it becomes the commit subject on main and the changelog line.
          EOF
          echo "Got: $TITLE"
          echo "Examples: fix: drop a renamed table's rows instead of panicking"
          echo "          feat(mysql): resume from a GTID set"
          echo "          feat!: rename the checkpoint index"
          exit 1
