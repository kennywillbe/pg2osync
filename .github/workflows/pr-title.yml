name: PR title

# The squash commit takes its subject from the pull request title, and
# release-please reads that subject to decide the next version and to write the
# changelog line. A title that does not parse is a change that silently never
# appears in a release, so it is checked here rather than noticed later.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional:
    name: the title is a conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|perf|test|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
            exit 0
          fi
          cat <<'EOF'
          ::error::The pull request title has to be a Conventional Commit, because it becomes the commit subject on main and the changelog line.
          EOF
          echo "Got: $TITLE"
          echo "Examples: fix: drop a renamed table's rows instead of panicking"
          echo "          feat(mysql): resume from a GTID set"
          echo "          feat!: rename the checkpoint index"
          exit 1
