name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push that supersedes another on the same branch makes the older run's
# result irrelevant; letting it finish only burns minutes and cache writes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with rust-version in Cargo.toml
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked

  e2e-postgres:
    name: e2e PostgreSQL to OpenSearch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sourcedb
        ports: ["15432:5432"]
        options: >-
          --name dev-postgres-1
          --health-cmd "pg_isready -U postgres -d sourcedb"
          --health-interval 5s --health-timeout 3s --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2.19.6
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q green"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the service container needs logical replication, which the image's
      # default command does not enable
      - name: Enable logical replication
        run: |
          docker exec dev-postgres-1 bash -c "
            echo 'wal_level = logical' >> /var/lib/postgresql/data/postgresql.conf
            echo 'max_replication_slots = 10' >> /var/lib/postgresql/data/postgresql.conf
            echo 'max_wal_senders = 10' >> /var/lib/postgresql/data/postgresql.conf"
          docker restart dev-postgres-1
          until docker exec dev-postgres-1 pg_isready -U postgres -d sourcedb; do sleep 2; done
      - run: docker exec -i dev-postgres-1 psql -U postgres -d sourcedb < dev/seed.sql
      - run: cargo build --release --locked -p pg2osync
      - run: ./dev/e2e-test.sh

  e2e-mysql:
    name: e2e MySQL to OpenSearch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysqlpw
          MYSQL_DATABASE: sourcedb
        ports: ["13306:3306"]
        options: >-
          --name mysql-test
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysqlpw"
          --health-interval 5s --health-timeout 5s --health-retries 30
      opensearch:
        image: opensearchproject/opensearch:2.19.6
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q green"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Create the replication user
        run: |
          docker exec mysql-test mysql -uroot -pmysqlpw -e "
            CREATE USER 'repl'@'%' IDENTIFIED WITH mysql_native_password BY 'replpw';
            GRANT SELECT, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'repl'@'%';"
      - name: Turn GTIDs on, so the checkpoint's GTID position is exercised
        # A service container takes no server flags, and mysql:8.0 starts with
        # gtid_mode = OFF, which would have the suite skip that section
        # entirely. This is MySQL's own online procedure for enabling them.
        run: |
          docker exec mysql-test mysql -uroot -pmysqlpw -e "
            SET @@GLOBAL.ENFORCE_GTID_CONSISTENCY = WARN;
            SET @@GLOBAL.ENFORCE_GTID_CONSISTENCY = ON;
            SET @@GLOBAL.GTID_MODE = OFF_PERMISSIVE;
            SET @@GLOBAL.GTID_MODE = ON_PERMISSIVE;"
          # every anonymous transaction has to finish before the last step
          for _ in $(seq 1 30); do
            count=$(docker exec mysql-test mysql -uroot -pmysqlpw -N -B -e \
              "SELECT COUNT(*) FROM performance_schema.global_status \
               WHERE VARIABLE_NAME = 'ONGOING_ANONYMOUS_TRANSACTION_COUNT' \
                 AND VARIABLE_VALUE <> '0';")
            [ "$count" = "0" ] && break
            sleep 1
          done
          docker exec mysql-test mysql -uroot -pmysqlpw -e "SET @@GLOBAL.GTID_MODE = ON;"
          docker exec mysql-test mysql -uroot -pmysqlpw -N -B -e "SELECT @@GLOBAL.gtid_mode;"
      - run: docker exec -i mysql-test mysql -uroot -pmysqlpw sourcedb < dev/mysql-seed.sql
      - run: cargo build --release --locked -p pg2osync
      - run: ./dev/e2e-mysql-test.sh

  docker:
    name: container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          # Only main writes layers. buildx never deletes what it wrote, so
          # writing from every pull request grew this cache to 6.3 GB and
          # pushed the repository past the 10 GB limit, at which point
          # GitHub evicts by last use — and what got evicted was the Rust
          # caches every other job depends on. Pull requests read main's
          # layers instead, which is where the 10 minutes of dependency
          # build actually comes from.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

  helm:
    name: helm chart lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/pg2osync
      - run: helm template pg2osync deploy/helm/pg2osync --set config.sync.users.table=public.users
      - run: kubectl kustomize deploy/kubernetes
