name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# This workflow publishes: every third-party action here is pinned by commit, so
# a moved tag cannot change what runs with a write token. CI, which holds no
# secrets and a read-only token, stays on version tags.
env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cache written on a tag ref can never be restored by anything else,
          # so saving here only consumes the repository's cache budget. Reading
          # main's cache still works.
          save-if: false
      - name: Install cross-compilation tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cross build --release --locked -p pg2osync --target ${{ matrix.target }}
          else
            cargo build --release --locked -p pg2osync --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          tar -czf pg2osync-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release pg2osync
          shasum -a 256 pg2osync-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            > pg2osync-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            pg2osync-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            pg2osync-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          # Uploads only. GitHub's auto-notes are appended by the `notes` job
          # below, once; generating them here would run once per matrix target
          # and repeat the section four times, as it did in v1.0.0 and v1.1.0.
          generate_release_notes: false

  # release-please creates the release with the changelog entry as its body.
  # This appends GitHub's "What's Changed" list under it exactly once, after
  # every upload has finished, so the body is complete when it is last touched.
  notes:
    name: release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: binaries
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read the layers main already built; do not write back. A
          # two-architecture mode=max cache is gigabytes, and the repository's
          # 10 GB of Actions cache is worth more to the jobs that run on every
          # pull request than to a build that happens once a release.
          cache-from: type=gha
      # The operator, from the same Dockerfile and on the same tags: the
      # manifests in deploy/operator pin both images to the release, so a
      # version of one that has no matching other is an install that cannot
      # come up.
      - id: meta-operator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-operator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}
          cache-from: type=gha
